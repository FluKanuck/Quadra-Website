<section class="page-hero">
  <x-img name="{{hero}}" sizes="100vw" eager decorative class="page-hero-bg">
  <div class="wrap page-hero-inner">
    <p class="kicker">{{kicker}}</p>
    <h1>{{h1}}</h1>
    <p class="lede">{{lead}}</p>
    <div class="ctas">
      <a class="btn btn-primary" href="/request-a-quote">Request a quote</a>
      <a class="btn btn-outline" href="tel:{{site.phoneHref}}">Call {{site.phone}}</a>
    </div>
  </div>
</section>
